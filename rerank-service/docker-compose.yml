# bge-reranker-v2-m3 独立重排服务 — 与 pgvector17 / community-redis 同在 Docker
services:
  rerank:
    build: .
    container_name: community-rerank
    ports:
      # 仅绑定本机回环地址，避免局域网任意客户端 POST /api/rerank 消耗推理资源
      - "127.0.0.1:8001:8001"
    environment:
      # 模型由部署脚本从 ModelScope 下载到 /models/bge-reranker-v2-m3（hf-mirror 不支持 HEAD，无法用 huggingface_hub 在线加载）
      - RERANK_MODEL_DIR=/models/bge-reranker-v2-m3
    volumes:
      # 模型持久化卷：下载一次，容器重启/重建不重复下载
      - rerank-models:/models
    # GPU 透传：rerank 走 RTX 3060 加速（CPU 推 8 条要 ~10s，GPU 亚秒级）；需宿主机已装 nvidia-container-toolkit
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  rerank-models:
