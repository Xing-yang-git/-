server:
  port: 8080
  # 绑定所有网络接口：确保手机同网段可访问后端
  address: 0.0.0.0
  servlet:
    encoding:
      # wx.uploadFile 按响应头里的 charset 解码响应体，缺省 charset 时中文报错信息会被
      # 按 Latin-1 解码成乱码（如"仅支持上传…"变成 ä»…æ"¯æŒ…），故强制响应携带 UTF-8
      charset: UTF-8
      force: true

spring:
  application:
    name: community-platform

  datasource:
    url: jdbc:postgresql://localhost:5433/community_platform
    username: postgres
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql,classpath:db/alter.sql
      data-locations: classpath:db/seed.sql
      continue-on-error: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    property-naming-strategy: LOWER_CAMEL_CASE

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# 微信小程序配置（真机调试 / 生产环境必须配置）
wechat:
  miniapp:
    app-id: ${WECHAT_APPID:}
    app-secret: ${WECHAT_SECRET:}

# JWT 配置
jwt:
  # 优先从 JWT_SECRET 环境变量注入；未设置时回退到本地开发默认值。
  # 生产环境必须通过环境变量提供至少 256 位的随机密钥并定期轮换。
  secret: ${JWT_SECRET:dev-secret-change-me-in-production}
  expiration: 604800000 # 7天

# 文件上传路径
file:
  upload-dir: ./uploads

logging:
  level:
    com.platform: DEBUG
    org.springframework.security: DEBUG

# AI 配置（Embedding API — 智谱 AI）
ai:
  embedding:
    api-key: ${BIGMODEL_EMBEDDING3_KEY:your-api-key}
    base-url: https://open.bigmodel.cn/api/paas/v4
    model: embedding-3
    similarity-threshold: 0.25
  zhipu:
    chat:
      api-key: ${BIGMODEL_EMBEDDING3_KEY:your-api-key}
      base-url: https://open.bigmodel.cn/api/paas/v4
      model-vision: glm-4v-flash
      model-text: glm-4-flash
