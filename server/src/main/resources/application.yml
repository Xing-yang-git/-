server:
  port: 8080

spring:
  application:
    name: community-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/community_platform
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql,classpath:db/alter.sql
      data-locations: classpath:db/seed.sql
      continue-on-error: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    property-naming-strategy: LOWER_CAMEL_CASE

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# JWT 配置
jwt:
  secret: YTk3ZDRmMjE4YzY1MjNhNDZiN2Y4ZDkwZTExNjM3NTJhYjhkZWZkMWEyMzQ1Njc4OTBiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHl6
  expiration: 604800000  # 7天

# 文件上传路径
file:
  upload-dir: ./uploads

logging:
  level:
    com.platform: DEBUG
    org.springframework.security: DEBUG
